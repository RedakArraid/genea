name: Tree display checks

on:
  push:
    branches: ['fix/tree-displays-2026-10-22']
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

concurrency:
  group: tree-displays-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  display-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix frontend
          npm ci
      - name: Geometry regression tests
        run: node --test scripts/test-tree-displays.cjs
      - name: Readability geometry and family grouping
        run: node --test scripts/test-tree-clarity.cjs
      - name: Existing layout tests
        run: npm test --prefix frontend
      - name: Build complete frontend
        run: npm run build --prefix frontend
        env:
          VITE_API_URL: http://127.0.0.1:5173/api
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser display tests with mocked API
        run: npx playwright test --config=playwright.displays.config.ts
      - name: Visual clarity and mobile reading journeys
        run: npx playwright test --config=playwright.clarity.config.ts
      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tree-display-screenshots
          path: |
            test-results/displays/**/*.png
            test-results/clarity/**/*.png
          if-no-files-found: ignore
          retention-days: 7
