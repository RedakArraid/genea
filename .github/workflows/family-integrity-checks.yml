name: Family integrity checks
on:
  push:
    branches: ['fix/tree-displays-2026-10-22']
  pull_request:
    branches: [dev, staging, main]
permissions:
  contents: read
concurrency:
  group: family-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  family-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: family_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: family_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U family_test -d family_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://family_test:disposable_test_only@127.0.0.1:5432/family_test
      FAMILY_TEST_DATABASE_URL: postgresql://family_test:disposable_test_only@127.0.0.1:5432/family_test
      JWT_SECRET: local-family-tests-only-not-a-deployment-secret
      NODE_ENV: test
      CORS_ORIGIN: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix frontend
          npm ci --prefix backend
      - name: Prepare disposable database
        run: |
          cd backend
          npx prisma generate
          npx prisma db push
      - name: Half-sibling geometry and classification
        run: node --test scripts/test-half-siblings.cjs
      - name: Existing frontend regressions
        run: |
          node --test scripts/test-tree-displays.cjs
          npm test --prefix frontend
      - name: Real API and PostgreSQL integrity tests
        run: node --test scripts/test-family-integrity.cjs
      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          VITE_API_URL: http://127.0.0.1:3001/api
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real browser, API and database family journeys
        run: npx playwright test --config=playwright.families.config.ts
      - name: Keep synthetic-family screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-integrity-screenshots
          path: test-results/families/**/*.png
          retention-days: 7
          if-no-files-found: ignore
