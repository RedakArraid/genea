name: Review source snapshot
on:
  push:
    branches: ['fix/tree-displays-2026-10-22']
    paths: ['.github/workflows/review-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD | gzip > /tmp/review-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: /tmp/review-source.tar.gz
          retention-days: 1
